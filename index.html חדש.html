function scene(){if(CLIPS.length)return;[['#rw',WIN,si],['#lw',LOSE,li]].forEach(([q,a,n])=>{const el=$(q);if(!el)return;el.innerHTML='<div class="sc2"><img alt="" decoding="async" src="'+a[n%a.length]+'"></div>'})}
function sis(){const g=$('#bl');if(!g)return;const c=cur,fell=mine&&mine.fell;
const p=c.p===0?0:c.p===2?1:Math.min(1,(c.d-1+1-c.ms/864e5)/30);
const pt=v=>{const q=.14+.86*v;return{x:20+280*q,y:200-140*q}},a=pt(fell?0:p);
g.setAttribute('transform','translate('+(a.x-9.8).toFixed(1)+' '+(a.y-19.7).toFixed(1)+')');
$('#mn').setAttribute('transform','translate('+(a.x-37.5).toFixed(1)+' '+(a.y+18.8).toFixed(1)+') rotate(-26.57)');
const br=$('#br');br.classList.toggle('rd',!!fell);
if(fell){const f=pt((mine.fell-1)/30);br.style.setProperty('--sx',(f.x-a.x).toFixed(1)+'px');br.style.setProperty('--sy',(f.y-a.y).toFixed(1)+'px')}
$('#sisC').textContent=c.p===0?t('sisP'):fell?t('sisF'):c.p===2?t('sisD'):t('sisC',Math.round(p*100))}
function lose(){}
function playClips(){const r=$('#rw');if(!r||!CLIPS.length)return;const v=document.createElement('video');v.src=CLIPS[ci%CLIPS.length];v.muted=true;v.autoplay=true;v.playsInline=true;v.onended=()=>{ci++;playClips()};r.textContent='';r.append(v);v.play().catch(()=>{})}
function ph(){const n=new Date();if(n<START)return{p:0,ms:START-n,d:0};
if(n.getFullYear()===2026&&n.getMonth()===10){const d=n.getDate();return{p:1,d,ms:new Date(2026,10,d+1)-n}}return{p:2,d:30,ms:0}}
function clk(ms){const s=Math.max(0,Math.floor(ms/1e3));return p2(Math.floor(s%86400/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)}
const seg=$('#seg');for(let i=0;i<30;i++)seg.appendChild(document.createElement('i'));
let all=[],mine=null,uid=null,db=null,user=null,arm=false,cur=ph();

function tick(){cur=ph();const c=cur;
if(c.p===0){$('#lbl').textContent=t('pre');$('#big').innerHTML=Math.floor(c.ms/864e5)+'<small> '+t('dd')+'</small>';$('#clk').textContent=clk(c.ms%864e5)}
else if(c.p===1){$('#lbl').textContent=t('dayL');$('#big').innerHTML=c.d+'<small> / 30</small>';$('#clk').textContent=clk(c.ms)+' '+t('left')}
else{$('#lbl').textContent=t('over');$('#big').textContent='30/30';$('#clk').textContent=t('overC')}
[...seg.children].forEach((e,i)=>{e.className=c.p===2||i<c.d-1?'p':(c.p===1&&i===c.d-1?'n':'')});
const T=$('#tsk');if(c.p===1){if(T.dataset.d!==String(c.d)){T.dataset.d=c.d;const nm=[7,14,21,30].find(m=>m>=c.d);T.hidden=false;
T.innerHTML='<div class="lbl">'+t('taskL')+'</div><div style="text-align:center;font-weight:800;font-size:18px;margin:6px 0"></div><div class="lbl">'+(nm===c.d?t('ms1',nm):t('ms2',nm,nm-c.d))+'</div>';
const tk=t('tasks');T.children[1].textContent=tk[(c.d-1)%tk.length]}}else T.hidden=true;sis()}

let nm='';
function renderAct(){sis();const a=$('#act'),c=cur;a.textContent='';
const mk=(x,cls,fn,dis)=>{const b=document.createElement('button');b.textContent=x;if(cls)b.className=cls;if(dis)b.disabled=true;b.onclick=fn;return b};
const note=k=>{$('#note').textContent=t(k)};
if(!db||!uid){const d=document.createElement('div');d.className='lbl';d.textContent=t('signin');a.append(d);return}
if(!mine){const r=document.createElement('div');r.className='row';
const ni=document.createElement('input');ni.placeholder=t('nick');ni.maxLength=24;ni.value=nm;ni.oninput=()=>{nm=ni.value};r.append(mk(t('join'),'',async()=>{try{await db.doc('survivors/'+uid).set({name:'wojak #'+(hs(uid)%9000+1000),days:[],fell:null})}catch(e){note('nowrite')}}));a.append(r);return}
if(mine.fell){const d=document.createElement('div');d.className='lbl';d.textContent=t('fellM',mine.fell,mine.days.length);a.append(avEl('f-sad',64),d);return}
const done=mine.days.includes(c.d),r=document.createElement('div');r.className='row';a.append(avEl('f-ok',56));
const lab=c.p===0?t('nostart'):c.p===2?t('over'):done?t('done'):t('still');
r.append(mk(lab,done?'ok':'',async()=>{try{await db.doc('survivors/'+uid).update({days:[...mine.days,c.d]})}catch(e){note('savef')}},c.p!==1||done));
if(c.p===1){const f=mk(t('fell'),'bad',async()=>{if(!arm){arm=true;f.textContent=t('sure');return}arm=false;try{await db.doc('survivors/'+uid).update({fell:c.d})}catch(e){note('savef')}});r.append(f)}
a.append(r);const s=document.createElement('div');s.className='lbl';s.style.marginTop='10px';s.textContent=t('marked')+mine.days.length+' · '+t('rk')+rank(mine.days.length);a.append(s);
if(c.p===1){const cp=mk(t('copy'),'sh',async()=>{const x=t('status',c.d,mine.days.length);try{await navigator.clipboard.writeText(x);cp.textContent=t('copied')}catch(e){cp.textContent=x}});a.append(cp)}}

const rn=(i,k)=>{let t=(i*7919+k*104729+1)>>>0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
function sim(){const c=cur,dn=c.p===0?0:c.p===1?c.d:30,o=[];for(let i=0;i<1000;i++){const f=rn(i,1)<.4?1+Math.floor(30*Math.pow(rn(i,2),1.7)):0,fell=f&&f<=dn?f:null;o.push({id:'sim'+i,days:new Array(fell?f-1:Math.max(0,c.p===2?30:dn-1)),fell})}return o}
function renderWall(){const w=$('#wall');w.textContent='';const L=all.concat(sim());
const al=L.filter(x=>!x.fell).length,fl=L.length-al;$('#sa').textContent=al;$('#sf').textContent=fl;$('#st').textContent=L.length?Math.round(al/L.length*100)+'%':'—';
const fc={};L.forEach(x=>{if(x.fell)fc[x.fell]=(fc[x.fell]||0)+1});const hk=Object.keys(fc).sort((a,b)=>fc[b]-fc[a])[0];$('#hd').textContent=hk?t('hard',hk,fc[hk]):'';
if(!L.length){const d=document.createElement('div');d.className='lbl';d.textContent=t('empty');w.append(avEl('f-sad',56),d);return}
const S=[...L].sort((a,b)=>(!!a.fell-!!b.fell)||(b.days.length-a.days.length));const cw=$('#crowd');cw.textContent='';cw.style.setProperty('--h','url('+HEAD+')');const fr=document.createDocumentFragment();S.slice(0,1500).forEach(x=>{const i=document.createElement('i');if(x.fell)i.className='f';fr.append(i)});cw.append(fr);const tp=[...all].sort((a,b)=>(!!a.fell-!!b.fell)||(b.days.length-a.days.length)).slice(0,100);w.hidden=!tp.length;tp.forEach(x=>{const r=document.createElement('div');r.className='u'+(x.fell?' f':'')+(x.id===uid?' me':'');
const n=document.createElement('span');n.className='n';n.textContent=(x.fell?'✕ ':'')+(x.name||t('anon')+' #'+(hs(x.id)%9000+1000))+(x.id===uid?' ('+t('you')+')':'')+(x.fell?'':' · '+rank(x.days.length));
const d=document.createElement('span');d.className='d';d.textContent=x.days.length;r.append(avEl(x.fell?'f-sad':'f-ok',28),n,d);
if(x.fell){const e=document.createElement('em');e.textContent=t('fellAt',x.fell);r.append(e)}w.append(r)})}

function applyLang(){const h=document.documentElement;h.lang=lang;h.dir=lang==='he'?'rtl':'ltr';
document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});$('#lg').textContent=t('lg');
document.title='NO NUT NOVEMBER.COM'}
$('#lg').onclick=()=>{lang=lang==='he'?'en':'he';try{localStorage.setItem('nnnl',lang)}catch(e){}arm=false;$('#tsk').dataset.d='';$('#note').textContent='';applyLang();tick();renderAct();renderWall();scene()};

scene();lose();playClips();setInterval(()=>{si++;li++;scene();lose()},2800);
setInterval(()=>{const old=cur.d;tick();if(old!==cur.d){renderAct();renderWall()}},1000);

const LS={m:{},g:k=>{try{return localStorage.getItem(k)}catch(e){return LS.m[k]||null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){LS.m[k]=v}}};
uid=LS.g('nnnu')||('u'+Math.random().toString(36).slice(2,10));LS.s('nnnu',uid);
let rec=null;try{rec=JSON.parse(LS.g('nnnr'))}catch(e){}
const subs=[],sv=()=>{LS.s('nnnr',JSON.stringify(rec));subs.forEach(f=>f())};
db={doc:()=>({set:async v=>{rec={...v};sv()},update:async v=>{rec={...(rec||{}),...v};sv()}}),collection:()=>({onSnapshot:cb=>{const f=()=>cb({docs:rec?[{id:uid,data:()=>rec}]:[]});subs.push(f);f()}})};
renderAct();
if(db){const tm=setTimeout(()=>{$('#note').textContent=t('slow')},1e4);
db.collection('survivors').onSnapshot(s=>{clearTimeout(tm);$('#note').textContent='';
all=s.docs.map(d=>{const v=d.data()||{};return{id:d.id,name:v.name,days:Array.isArray(v.days)?v.days:[],fell:v.fell||null}});
mine=all.find(x=>x.id===uid)||null;renderAct();renderWall()},e=>{clearTimeout(tm);$('#note').textContent=t('err')})}
})();
</script>
